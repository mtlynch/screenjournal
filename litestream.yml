access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
dbs:
  - path: ${DB_PATH}
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: db
        endpoint: ${LITESTREAM_ENDPOINT}
        force-path-style: true
        retention: 24000h # 1000 days, roughly 3 years
        snapshot-interval: 24h
        validation-interval: 72h
        sync-interval: 10m
# Give the final sync room to persist recent writes before Fly terminates the
# machine. fly.toml's kill_timeout must remain above this value.
shutdown-sync-timeout: 60s
